<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A rose, gathered from a thousand little lights." />
    <title>For Delaney</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <audio id="love-song" src="bg_music.mp3" loop preload="auto"></audio>
    <button id="music-control" class="music-control" type="button" aria-label="Play our song" aria-pressed="false"><span id="music-icon" aria-hidden="true">▶</span></button>
    <main>
      <section class="scene">
        <canvas id="bouquet" aria-label="A softly swirling particle rose"></canvas>
        <section class="message" aria-label="Dedication">
          <p class="eyebrow">A thousand little moments</p>
          <h1>For Delaney</h1>
          <p>A rose, gathered from a thousand little lights.</p>
        </section>
      </section>
      <!--
      The private photo gallery stays locally in assets/ and is intentionally
      excluded from the public site and repository.
      <section class="memories" aria-labelledby="memories-title">
        <p class="eyebrow">Our little gallery</p>
        <h2 id="memories-title">Moments with you</h2>
        <p class="memory-intro">Every picture is one more reason I am grateful that you are in my life.</p>
        <div class="photo-grid">
          <figure class="photo-card photo-card--tall"><img src="assets/image-01.jpg" alt="Delaney and Charlie smiling at the beach" loading="eager"></figure>
          <figure class="photo-card"><img src="assets/image-02.jpg" alt="A handwritten love note for Delaney" loading="lazy"></figure>
          <figure class="photo-card"><img src="assets/image-03.jpg" alt="Delaney and Charlie embracing at the beach" loading="lazy"></figure>
          <figure class="photo-card photo-card--wide"><img src="assets/image-04.jpg" alt="Delaney and Charlie sharing a sunny moment" loading="lazy"></figure>
          <figure class="photo-card"><img src="assets/image-05.jpg" alt="Delaney and Charlie together at dinner" loading="lazy"></figure>
          <figure class="photo-card"><img src="assets/image-06.jpg" alt="A close selfie of Delaney and Charlie" loading="lazy"></figure>
          <figure class="photo-card photo-card--wide"><img src="assets/image-07.jpg" alt="Delaney and Charlie at the beach" loading="lazy"></figure>
          <figure class="photo-card"><img src="assets/image-08.jpg" alt="Delaney and Charlie smiling together outdoors" loading="lazy"></figure>
        </div>
      </section>
      -->
    </main>
    <script src="script.js"></script>
  </body>
</html>
